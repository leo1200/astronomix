[tool.poetry]
name = "astronomix"
version = "0.6.6"
description = "differentiable (magneto)hydrodynamics for astrophysics in JAX"
authors = ["Leonard Storcks"]
readme = "README.md"
packages = [{include = "astronomix"}]

[tool.poetry.dependencies]
python = ">=3.9"
# Pinned to the 0.9 line: the Pallas kernels use the Triton lowering, which
# JAX deprecated in 0.11.0 in favour of Mosaic GPU. The pin is lifted once the
# kernels are ported or the Triton lowering is confirmed on a newer release.
jax = ">=0.9.2,<0.10"
scipy = ">=1.0.0"
astropy = ">=6.0.0"
numpy = ">=1.0.0"
equinox = ">=0.10.10"
beartype = ">=0.19.0"
# Pinned to the 0.11.0–0.11.10 line: it is the Orbax range whose multi-device
# (sharded) save/restore round-trips correctly against the project's JAX 0.6.2.
# Newer Orbax (>=0.11.20) either corrupts sharded restores or calls
# jax.sharding.set_mesh as a context manager, which JAX 0.6.2 does not support.
orbax-checkpoint = ">=0.11.0,<0.11.11"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
# `pytest` from the repository root runs the test suite in one process without the slow tests (CPU: about
# 11 minutes); `pytest -m ""` runs every test. The markers are handled in pytests/conftest.py.
testpaths = ["pytests"]
addopts = "-m 'not slow'"
markers = [
    "x64: the tests of the module run with 64-bit floats (jax.enable_x64 around the module)",
    "slow: 20 s or more on the CPU; deselected by default, `pytest -m \"\"` runs it",
    "gpu: needs a GPU (the compiled Pallas kernels); skipped without one",
    "devices(n): needs n devices; skipped with fewer",
]

[tool.ruff]
extend-select = ["E", "F", "I", "C", "B", "D", "Q"]
# Globally ignore "module level import not at top of file"
extend-ignore = ["E402"]